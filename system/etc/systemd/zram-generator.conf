# zram: compressed swap living inside RAM itself.
#
# WHY IT USED TO BE 4 GiB: the generator's default is min(ram / 2, 4096), and
# with 15.4 GiB of RAM the 4096 MB cap was what won. Here that cap is removed
# and ram / 2 = ~7.7 GiB is used instead, the top end of the range the project
# itself recommends (fractions from 0.1 to 0.5).
#
# zram-resident-limit is the safety net almost no tutorial mentions, and it is
# needed here: zram-size says how much data fits UNCOMPRESSED, not how much RAM
# the device costs. With incompressible pages (video, already-compressed images)
# zram could end up occupying the full 7.7 GiB of real RAM, and the cure would
# be worse than the disease. With this limit it never exceeds ram / 4 =
# ~3.85 GiB of real RAM; on hitting the ceiling the swap simply behaves as full
# and the rest of the chain takes over. With zstd (~3:1) normal use sits around
# 2.6 GiB, so the ceiling is almost never even brushed.
[zram0]
zram-size = ram / 2
zram-resident-limit = ram / 4
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
