# Retry if reflector finds itself without DNS at boot.
# Written on 2026-09-14.
#
# On 14 Sep at 13:40:32 reflector failed instantly with
#   error: failed to retrieve mirrorstatus data: URLError:
#          <urlopen error [Errno -2] Name or service not known>
# The unit already asks for Wants/After=network-online.target and
# nss-lookup.target, so ordering is NOT the problem: the network was up, but DNS
# was not resolving yet (systemd-resolved takes longer to become usable than
# network-online.target takes to count as reached).
#
# Without retries, a failure like that leaves the mirror list frozen until the
# timer's next run, which is WEEKLY: the one from 7 September had been in force
# for 7 days and had another 6 to go. A stale mirrorlist is exactly what
# produces the 404s on install even though pacman says nothing is pending.
#
# With this, if it fails it tries again after 2 minutes, up to 5 times. If by
# the fifth it still has no DNS, it gives up and the weekly timer will pick it
# up.
[Unit]
StartLimitIntervalSec=30min
StartLimitBurst=5

[Service]
Restart=on-failure
RestartSec=2min
