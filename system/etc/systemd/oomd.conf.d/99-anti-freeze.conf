# systemd-oomd: kill the glutton BEFORE the laptop gets stuck.
# Written on 2026-09-14.
#
# On 14 Sep 2026 at 15:20 oomd DID do its job: it flagged the terminal that had
# eaten 12.9 GB and killed it. The problem is WHEN. With the default threshold
# (swap at 90%), by the time it fired the RAM was already at 90% and the zram at
# 99.99%, and the machine had not responded to keyboard or screen for a while.
# Killing the culprit when the system is already frozen is no use at all: the
# user had already pressed the button eight times.
#
# With swap at 70% there is still room to manoeuvre and the desktop stays alive.
[OOM]
SwapUsedLimit=70%

# Sustained memory pressure: the default is 60% for 30 s. Thirty seconds of
# pressure at 60% on a 15 GiB laptop are already thirty seconds of stutter.
# Lowering it to 50% for 10 s turns it into a reaction, not an autopsy.
DefaultMemoryPressureLimit=50%
DefaultMemoryPressureDurationSec=10s
