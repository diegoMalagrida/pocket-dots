# Va como drop-in y no editando logind.conf: asi una actualizacion de systemd no
# deja un .pacnew que haya que reconciliar a mano.

[Login]
# El boton de encendido NO apaga de golpe. Quien manda es el menu de apagado del
# notch (Super+Shift+Q), que pregunta. Mantenerlo pulsado si apaga, que es la
# salida de emergencia de siempre.
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff

# Con el portatil enchufado, cerrar la tapa no suspende: se usa como sobremesa
# con la tapa bajada. Con bateria sigue el comportamiento normal (suspender).
HandleLidSwitchExternalPower=ignore
