# It goes as a drop-in and not by editing logind.conf: that way a systemd update
# does not leave a .pacnew that has to be reconciled by hand.

[Login]
# The power button does NOT shut down outright. The notch's power menu
# (Super+Shift+Q), which asks first, is in charge. Holding it down DOES power
# off, which is the usual emergency exit.
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff

# With the laptop plugged in, closing the lid does not suspend: it is used as a
# desktop with the lid down. On battery the normal behaviour applies (suspend).
HandleLidSwitchExternalPower=ignore
