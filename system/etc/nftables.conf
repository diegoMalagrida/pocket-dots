#!/usr/bin/nft -f

# Remove the previous Arch sample table, then manage only our host table.
destroy table inet filter
# Host firewall. Docker manages its own forwarding rules separately.
destroy table inet host_filter
table inet host_filter {
  chain input {
    type filter hook input priority filter
    policy drop

    ct state invalid drop comment "drop invalid packets"
    ct state { established, related } accept comment "allow tracked connections"
    iifname "lo" accept comment "allow loopback"
    meta l4proto { icmp, icmpv6 } accept comment "allow network diagnostics"

    # Tailscale. DELETE THESE TWO LINES IF YOU DO NOT USE IT: without the daemon
    # behind them they are useless, and the second one opens a port that is not
    # needed.
    #
    # The first lets SSH in only through the VPN interface, never through the
    # wifi or the cable. The second does NOT carry iifname on purpose, and it is
    # the only exception in the file: 41641 is the port through which two
    # machines find each other DIRECTLY, and that negotiation arrives through
    # the physical interface, which is precisely where tailscale0 does not exist
    # yet. Without it everything keeps working, but the traffic takes a detour
    # through the DERP relays and you notice.
    iifname "tailscale0" tcp dport 22 accept comment "allow SSH over Tailscale"
    udp dport 41641 accept comment "allow direct Tailscale connections"

    udp sport 67 udp dport 68 accept comment "allow DHCPv4 client replies"
    udp sport 547 udp dport 546 accept comment "allow DHCPv6 client replies"
    ip daddr { 224.0.0.251, 224.0.0.252 } udp dport { 5353, 5355 } accept comment "allow local IPv4 discovery"
    ip6 daddr { ff02::fb, ff02::1:3 } udp dport { 5353, 5355 } accept comment "allow local IPv6 discovery"

    limit rate 10/second burst 20 packets counter reject with icmpx type admin-prohibited
    counter drop
  }

  chain forward {
    type filter hook forward priority filter
    policy accept

    # Do not route directly between physical interfaces. Docker bridges remain usable.
    iifname { "wlan0", "enp1s0" } oifname { "wlan0", "enp1s0" } counter drop
  }
}
