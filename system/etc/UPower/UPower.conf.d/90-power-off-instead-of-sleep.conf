# Make the laptop SHUT DOWN when the battery runs out, not go back to sleep.
# Written on 2026-09-14.
#
# WHAT WAS HAPPENING: with PercentageAction=2.0 and CriticalPowerAction=Auto, the
# effective action was "Sleep" (it shows in `upower -d`: critical-action: Sleep).
# So on reaching 2 % the laptop WENT BACK TO SUSPEND, kept draining, and died
# from the power cut. It happened twice within the history that is left:
#   2026-09-08 12:17:09 systemd-logind: suspend requested from client ('upowerd')
#   2026-09-12 10:07:13 systemd-logind: suspend requested from client ('upowerd')
# In both cases the boot's journal ends in "PM: suspend entry (s2idle)" and
# `last` marks the boot as "crash". On 12 Sep the battery read 0.213 % when it
# was plugged in.
#
# Those are 2 of this machine's ~55 historical power cuts: they are not hangs,
# it is the battery. The filesystem copes fine (systemd syncs and freezes
# everything before entering s2idle, and `dumpe2fs` says "Filesystem state:
# clean"), so the real damage is not corruption: it is (a) losing the whole
# session and (b) draining the cell down to 0.2 %, which is what really
# punishes it.
#
# This laptop has no S3: only s2idle, which really does draw power here.
# Measured with upower's history: 0.68 W over a 22.5 h suspend and 1.07 W over
# another of 4.4 h. So the battery empties on its own in a couple of days with
# the lid closed.
#
# THE REAL CURE is hibernation, and since 2026-09-14 it is finally possible,
# because there is a /swapfile (before, the only swap was zram and that is why
# it had been ruled out). But hibernating forces the Samsung 980 NVMe behind the
# VMD to reinitialise from scratch, and that disk is precisely the suspect in
# the hang on wake-up that was fixed that same day: the two changes are NOT
# chained together. This here is the cheap, risk-free half, which turns a power
# cut into a clean shutdown; hibernation will be tested by hand later on.
[UPower]
# Really power off, instead of "Auto" (which resolved to Sleep).
CriticalPowerAction=PowerOff

# And do it at 5 %, not at 2 %: at 2 % there is no margin left to close anything
# in an orderly way, and going down that far is what ages the cell.
PercentageAction=5.0
