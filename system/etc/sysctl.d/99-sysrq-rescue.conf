# Allow rescue from the keyboard when the system hangs.
# Written on 2026-09-14.
#
# The default value was 16, which only allows "sync". With that, the only way
# out of a freeze was to hold down the power button: a brute-force power cut,
# with the filesystem mounted read-write. Of this machine's 500 boots, 55 ended
# that way.
#
# The value 1 enables every SysRq function, and in particular the orderly
# reboot sequence. Hold down Alt + Print Screen and press, calmly and with a
# second between each one:
#
#     R  hands the keyboard back to the kernel (takes it from the compositor)
#     E  asks every process to terminate
#     I  kills the ones that did not listen
#     S  SYNCS THE DISKS  <- this is what the button never does
#     U  remounts everything read-only
#     B  reboots
#
# Mnemonic: "Raising Elephants Is So Utterly Boring".
# If the disk no longer responds, S will do nothing, but B still works: even
# so it is better than the button, because U's read-only remount protects the
# filesystem.
#
# It has no cost and no downside: SysRq only answers the physical combination
# with the Print Screen key, which nobody presses by accident.
kernel.sysrq = 1
