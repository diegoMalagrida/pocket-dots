# Stop the laptop FREEZING when memory fills up.
# Written on 2026-09-14, after the machine stopped responding at 15:20 with RAM
# at 90% and zram at 99.99%, and the power button had to be held down. Out of
# 500 boots, 55 had ended that way.
#
# The problem is not running out of memory: it is that the kernel starts freeing
# it TOO LATE. With the default value (10 = 0.1% of RAM), kswapd does not wake
# up until about 15 MB out of 15 GiB are left free. By then there is no margin
# left to reclaim anything without blocking whoever is asking for memory, and
# the system enters a loop in which neither the keyboard nor the screen respond.
#
# With 125 (1.25%) the kernel starts reclaiming with ~190 MB still free. That
# turns the wall into a slope: the machine gets slow, which is annoying but
# reversible, instead of dying.
vm.watermark_scale_factor = 125

# A memory cushion the kernel keeps for itself and never hands out. The default
# here was 66 MB, scant for 15 GiB: allocations that cannot wait (the drivers',
# the graphics card's among them) were left with nothing just when they were
# needed most. 128 MB is 0.8% of RAM: you notice it in the accounting, not in use.
vm.min_free_kbytes = 131072

# NOTE: vm.swappiness = 150 and vm.page-cluster = 0 still live in
# 99-zram.conf and are correct for zram. They are not touched here.
