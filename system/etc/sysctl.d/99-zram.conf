# Kernel settings that go alongside zram.

# swappiness: how much the kernel prefers pushing anonymous pages to swap rather
# than dropping file cache. The default (60) is written for swap on DISK, which
# is slow and worth avoiding. Here swap IS compressed RAM and costs microseconds,
# so it is worth reaching for it happily instead of losing cache. The range goes
# up to 200 as of Linux 5.8; 150 is the usual value with zram.
vm.swappiness = 150

# page-cluster: how many pages are pulled in at once when faulting back from
# swap. It was at 3, i.e. 8 pages per fault. That makes sense on a disk, where
# the expensive part is the seek latency and you may as well grab extra while
# you are there. On zram there is no seek: reading extra only burns CPU
# decompressing what nobody asked for. 0 = one page per fault, which is optimal
# for swap in memory.
vm.page-cluster = 0
