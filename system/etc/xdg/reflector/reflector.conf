# Mirrors de pacman, elegidos por reflector.timer una vez por semana.
#
# Va el fichero entero y no un drop-in porque reflector no los admite. Al
# actualizar el paquete, pacman dejara un .pacnew al lado.

--save /etc/pacman.d/mirrorlist
--protocol https

# Paises vecinos, no el mundo entero: desde aqui un mirror aleman va bien y uno
# australiano no, por muy sincronizado que este.
--country Spain,France,Germany,Portugal

# 15 y no 5: con solo cinco, si dos estan caidos la actualizacion se arrastra.
--latest 15

# Por VELOCIDAD medida, no por fecha de sincronizacion. Un mirror recien
# sincronizado pero lento no sirve de nada.
--sort rate
