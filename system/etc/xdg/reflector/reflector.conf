# pacman mirrors, chosen by reflector.timer once a week.
#
# The whole file goes in and not a drop-in because reflector does not support
# them. When the package is updated, pacman will leave a .pacnew next to it.

--save /etc/pacman.d/mirrorlist
--protocol https

# Neighbouring countries, not the whole world: from here a German mirror works
# well and an Australian one does not, however well synced it is.
--country Spain,France,Germany,Portugal

# 15 and not 5: with only five, if two are down the update crawls.
--latest 15

# By measured SPEED, not by sync date. A mirror that has just synced but is
# slow is no use at all.
--sort rate
