# Force Electron apps to use Wayland
ELECTRON_OZONE_PLATFORM_HINT=wayland
OZONE_PLATFORM=wayland
NATIVE_WAYLAND=1

# (optional) Ensures native decorations in Electron
GTK_USE_PORTAL=1

# Qt5 and Qt6 do not share a platform theme and QT_QPA_PLATFORMTHEME does not
# accept a list (tested: 'noexiste:gtk3' is read literally, it does not fall
# through to the next one), so each family goes its own way:
#   - Qt6 through qt6ct. It used to go through gtk3, which also gave it the
#     wallpaper's colours, but only when the window opened: the qt6ct plugin
#     watches its .conf and repaints windows that are already open when the
#     wallpaper changes. File dialogs are still GTK's (standard_dialogs=gtk3)
#     and the typeface is pinned to the same one GTK uses.
#   - Qt5, which here is only VLC, through qt5ct from the ~/.local/bin/vlc
#     wrapper.
# Both palettes are written from pywal by ~/.config/hypr/scripts/qt-pywal.py.
QT_QPA_PLATFORMTHEME=qt6ct
