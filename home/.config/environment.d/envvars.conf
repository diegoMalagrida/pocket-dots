# Forzar Electron apps a usar Wayland
ELECTRON_OZONE_PLATFORM_HINT=wayland
OZONE_PLATFORM=wayland
NATIVE_WAYLAND=1

# (opcional) Asegura decoraciones nativas en Electron
GTK_USE_PORTAL=1

# Qt5 y Qt6 no comparten tema de plataforma y QT_QPA_PLATFORMTHEME no admite
# lista (probado: 'noexiste:gtk3' se lee literal, no cae al siguiente), asi que
# cada familia va por su lado:
#   - Qt6 por qt6ct. Antes iba por gtk3, que tambien le daba los colores del
#     fondo, pero solo al abrir la ventana: el plugin de qt6ct vigila su .conf
#     y repinta las ventanas ya abiertas cuando cambia el wallpaper. Los
#     dialogos de fichero siguen siendo los de GTK (standard_dialogs=gtk3) y la
#     tipografia esta fijada a la misma que usa GTK.
#   - Qt5, que aqui es solo VLC, por qt5ct desde el envoltorio ~/.local/bin/vlc.
# Las dos paletas las escribe ~/.config/hypr/scripts/qt-pywal.py desde pywal.
QT_QPA_PLATFORMTHEME=qt6ct
