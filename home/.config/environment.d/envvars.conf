# Forzar Electron apps a usar Wayland
ELECTRON_OZONE_PLATFORM_HINT=wayland
OZONE_PLATFORM=wayland
NATIVE_WAYLAND=1

# (opcional) Asegura decoraciones nativas en Electron
GTK_USE_PORTAL=1

# Qt5/Qt6: usa la plataforma GTK3 para compartir modo oscuro, tipografia,
# dialogos e integracion de color con el resto del escritorio.
QT_QPA_PLATFORMTHEME=gtk3
