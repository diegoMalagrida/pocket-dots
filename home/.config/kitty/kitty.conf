# Fonts {{{
# Font family. You can also specify different fonts for the
# bold/italic/bold-italic variants. By default they are derived automatically,
# by the OSes font system. Setting them manually is useful for font families
# that have many weight variants like Book, Medium, Thick, etc. For example:
#
# You can get a list of full family names available on your computer by running
# kitty list-fonts
# The default values shown below rely on your OS to choose an appropriate monospace font family.
font_family        JetBrainsMono Nerd Font Mono
bold_font          auto
italic_font        Operator Mono Bold Italic
bold_italic_font   auto

map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

font_size        9

# background_opacity 0.95
dynamic_background_opacity yes

hide_window_decorations titlebar-only
window_padding_width 6

enable_audio_bell no

# Colors
include ./theme.conf

background_opacity         0.95
dynamic_background_opacity yes


shell zsh
shell_integration disabled

url_style curly

remember_window_size no

scrollbar_handle_opacity                0
scrollbar_track_opacity                 0
scrollbar_track_opacity_hover_opacity   0
confirm_os_window_close                 0


sync_to_monitor no
cursor_trail 20
cursor_trail_decay 0.02 0.13
cursor_trail_start_threshold 0
cursor_shape block
cursor_blink true
# --- pywal: colores dinámicos del wallpaper (sobreescriben theme.conf) ---
# revertir: comenta la siguiente línea
include /home/diego/.cache/wal/colors-kitty.conf

# >>> btop-pywal: permite que set-wallpaper.sh envie ctrl+R a un btop vivo
# para que recargue el tema sin cerrarlo. socket-only = solo por socket local,
# no por secuencias de escape de cualquier programa.
allow_remote_control socket-only
listen_on unix:@kitty-{kitty_pid}
# <<< btop-pywal
