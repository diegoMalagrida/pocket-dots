# hypridle — idle management (lock / screen off / suspend)
# docs: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    lock_cmd = pidof hyprlock || hyprlock        # avoids launching several hyprlocks at once
    before_sleep_cmd = loginctl lock-session     # locks BEFORE suspending
    # Lua syntax (Hyprland 0.55+). A bare `dpms on` is a syntax error in Lua
    # and hyprctl exits with code 7 without doing anything: the screen would
    # stay BLACK on resume from suspend. It is the costliest failure on this
    # list, because it looks as if the laptop does not wake up.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'   # turns the screen on at wake-up
    ignore_wayland_inhibit = false               # honours Waybar's caffeine cup
}

# 5 min → dims the brightness (a gentle warning that it is about to lock)
#
# The guard is NOT redundant. A desktop machine has no internal panel, which
# means there is no /sys/class/backlight at all — and brightnessctl WITHOUT A
# CLASS walks the classes in order (backlight, then leds) and takes the first
# one that has anything. Without the guard, after five minutes of not touching
# anything the tower would start turning off the caps-lock LED and "restoring"
# it on return: a lock warning nobody understands and that leaves the keyboard
# changed on top of that.
#
# Belt and braces: the grep decides WHETHER anything is done, and `-c backlight`
# decides ON WHAT. `-l` lists every device with its class and exits with code 0
# even when there is no backlight one, so what rules is the grep, not the exit
# code. With a panel: the usual warning. Without one: nothing, silently.
listener {
    timeout = 300
    on-timeout = brightnessctl -l 2>/dev/null | grep -q "class 'backlight'" && brightnessctl -c backlight -s set 10%
    on-resume = brightnessctl -l 2>/dev/null | grep -q "class 'backlight'" && brightnessctl -c backlight -r
}

# 6 min → locks the session
listener {
    timeout = 360
    on-timeout = loginctl lock-session
}

# 7 min → turns the screen off
listener {
    timeout = 420
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 20 min → suspends the machine
listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
