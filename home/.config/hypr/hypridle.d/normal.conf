# hypridle — gestión de inactividad (bloqueo/apagado de pantalla/suspensión)
# docs: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    lock_cmd = pidof hyprlock || hyprlock        # evita lanzar varios hyprlock a la vez
    before_sleep_cmd = loginctl lock-session     # bloquea ANTES de suspender
    # Sintaxis Lua (Hyprland 0.55+). `dpms on` a secas es un error de sintaxis
    # en Lua y hyprctl sale con codigo 7 sin hacer nada: la pantalla se
    # quedaria NEGRA al volver de suspender. Es el fallo mas caro de esta
    # lista, porque parece que el portatil no despierta.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'   # enciende la pantalla al despertar
    ignore_wayland_inhibit = false               # respeta la taza de cafeína de Waybar
}

# 5 min → baja el brillo (aviso suave de que va a bloquear)
#
# El guardia NO sobra. Un equipo de sobremesa no tiene panel interno, o sea que
# no hay ningun /sys/class/backlight — y brightnessctl SIN CLASE recorre las
# clases en orden (backlight, luego leds) y se queda con la primera que tenga
# algo. Sin guardia, a los cinco minutos de no tocar nada la torre se pondria a
# apagar el LED de bloq-mayus y a "restaurarlo" al volver: un aviso de bloqueo
# que nadie entiende y que encima deja el teclado cambiado.
#
# Doble cinturon: el grep decide SI se hace algo, y el `-c backlight` decide
# SOBRE QUE. `-l` lista todos los dispositivos con su clase y sale con codigo 0
# aunque no haya ninguno de backlight, asi que lo que manda es el grep, no el
# codigo de salida. Con panel: el aviso de siempre. Sin panel: nada, en silencio.
listener {
    timeout = 300
    on-timeout = brightnessctl -l 2>/dev/null | grep -q "class 'backlight'" && brightnessctl -c backlight -s set 10%
    on-resume = brightnessctl -l 2>/dev/null | grep -q "class 'backlight'" && brightnessctl -c backlight -r
}

# 6 min → bloquea la sesión
listener {
    timeout = 360
    on-timeout = loginctl lock-session
}

# 7 min → apaga la pantalla
listener {
    timeout = 420
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'
}

# 20 min → suspende el equipo
listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
