# hypridle — REMOTE MODE (switched on by ~/.local/bin/remote-mode)
# Differences from normal.conf:
#   - It STILL locks at 6 min (RustDesk captures hyprlock and you can unlock
#     by typing the password from outside, so leaving it reachable costs no
#     security).
#   - It does NOT switch the screen off: with DPMS off the compositor stops
#     compositing and the capture goes black.
#   - It does NOT suspend: there is no way at all to connect to a sleeping laptop.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    ignore_wayland_inhibit = false
}

# 6 min → locks the session (it can be unlocked remotely)
listener {
    timeout = 360
    on-timeout = loginctl lock-session
}
