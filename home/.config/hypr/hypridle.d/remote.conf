# hypridle — MODO REMOTO (lo activa ~/.local/bin/remote-mode)
# Diferencias con normal.conf:
#   - SIGUE bloqueando a los 6 min (RustDesk captura hyprlock y puedes
#     desbloquear escribiendo la contraseña desde fuera, así que no pierdes
#     seguridad por dejarlo accesible).
#   - NO apaga la pantalla: con DPMS off el compositor deja de componer y
#     la captura se va a negro.
#   - NO suspende: a un portátil dormido no te puedes conectar de ninguna forma.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'
    ignore_wayland_inhibit = false
}

# 6 min → bloquea la sesión (se puede desbloquear en remoto)
listener {
    timeout = 360
    on-timeout = loginctl lock-session
}
