source = ~/.cache/wal/colors-hyprlock.conf
# hyprlock — isla de bloqueo, en el mismo lenguaje visual que Quickshell.
# La superficie permanece negra; pywal aporta el acento al cambiar de fondo.

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = softOut, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 3.2, softOut
    animation = fadeOut, 1, 2.1, softOut
    animation = inputFieldColors, 1, 1.3, softOut
    animation = inputFieldDots, 1, 2.1, softOut
}

# El fondo sigue el wallpaper actual. Se suaviza lo justo para separar la isla
# sin borrar la imagen que gobierna toda la estetica del escritorio.
background {
    monitor =
    path = /home/diego/.cache/wal/lockbg
    blur_passes = 2
    blur_size = 4
    noise = 0.008
    contrast = 0.92
    brightness = 0.68
    vibrancy = 0.14
    vibrancy_darkness = 0.05
}

# Una unica superficie, como el centro de control que despliega el notch.
shape {
    monitor =
    size = 520, 340
    color = $surface
    rounding = 32
    border_size = 1
    border_color = $outline
    shadow_passes = 3
    shadow_size = 18
    shadow_color = $shadow
    shadow_boost = 1.1
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}

# Medallon de bloqueo: el acento del wallpaper aparece aqui y en el campo.
shape {
    monitor =
    size = 42, 42
    color = $surfaceAlt
    rounding = -1
    border_size = 1
    border_color = $accent
    position = 0, 130
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = 󰌾
    font_size = 17
    font_family = JetBrains Mono Nerd Font
    color = $accent
    position = 0, 130
    halign = center
    valign = center
    zindex = 2
}

# Reloj: proporcional como el notch, con cifras tabulares que no bailan.
label {
    monitor =
    text = <span font_features="tnum">$TIME</span>
    font_size = 68
    font_family = Adwaita Sans
    color = $text
    position = 0, 58
    halign = center
    valign = center
    zindex = 2
}

# Fecha en espanol independientemente del locale global de la sesion.
label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/lock-info.sh date
    font_size = 15
    font_family = Adwaita Sans
    color = $muted
    position = 0, 4
    halign = center
    valign = center
    zindex = 2
}

# Campo-pildora: activo por defecto; al validar o fallar cambia con colores que
# conservan su significado aunque pywal produzca otra paleta.
input-field {
    monitor =
    size = 360, 50
    outline_thickness = 2
    dots_size = 0.20
    dots_spacing = 0.38
    dots_center = true
    dots_rounding = -1
    outer_color = $accent
    inner_color = $surfaceAlt
    font_color = $text
    font_family = Adwaita Sans
    fade_on_empty = false
    placeholder_text = <span alpha="55%">Escribe tu contraseña</span>
    check_color = $ok
    check_text = Comprobando…
    fail_color = $fail
    fail_text = No coincide · intento $ATTEMPTS
    capslock_color = $warn
    rounding = -1
    shadow_passes = 1
    shadow_size = 8
    shadow_color = $shadow
    position = 0, -58
    halign = center
    valign = center
    zindex = 2
}

# Pie de la isla: identidad a la izquierda y bateria a la derecha.
label {
    monitor =
    text = 󰀄  $USER
    font_size = 12
    font_family = JetBrains Mono Nerd Font
    color = $dim
    position = -154, -124
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:30000] ~/.config/hypr/scripts/lock-info.sh battery
    font_size = 12
    font_family = JetBrains Mono Nerd Font
    color = $dim
    position = 154, -124
    halign = center
    valign = center
    zindex = 2
}
