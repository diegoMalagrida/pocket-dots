source = ~/.cache/wal/colors-hyprlock.conf

# ── language ──────────────────────────────────────────────────────────────
# The three texts are defined HERE in Spanish and the `source` below
# overrides them when there is a language file. That order is deliberate: it
# has been verified that a `source` which cannot find its file leaves an error
# in the log and hyprlock carries on ("Proceeding ignoring faulty entries"),
# so in the worst case the lock screen comes up in Spanish instead of with
# blank labels. No other failure mode can be allowed here: this is the screen
# that stands between Diego and his own computer.
#
# The installer writes the file (./install.sh --lang en) by copying
# language.en.conf or language.es.conf over language.conf.
$lockPlaceholder = Escribe tu contraseña
$lockCheck = Comprobando…
$lockFail = No coincide · intento $ATTEMPTS
source = ~/.config/hypr/language.conf
# hyprlock — lock island, in the same visual language as Quickshell.
# The surface stays black; pywal supplies the accent when the wallpaper changes.

general {
    hide_cursor = true
    # false, not true, ever since the face can unlock: howdy only looks when
    # hyprlock submits what was typed, so with `true` an Enter on empty input
    # did nothing and the camera never got to switch on. The gesture now is
    # pressing Enter without typing. The password is just as valid as before.
    ignore_empty_input = false
}

animations {
    enabled = true
    bezier = softOut, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 3.2, softOut
    animation = fadeOut, 1, 2.1, softOut
    animation = inputFieldColors, 1, 1.3, softOut
    animation = inputFieldDots, 1, 2.1, softOut
}

# The background follows the current wallpaper. It is softened just enough to
# set the island apart without erasing the image that drives the whole look of
# the desktop.
background {
    monitor =
    path = /home/diego/.cache/wal/lockbg
    blur_passes = 2
    blur_size = 4
    noise = 0.008
    contrast = 0.92
    brightness = 0.68
    vibrancy = 0.14
    vibrancy_darkness = 0.05
}

# A single surface, like the control centre the notch unfolds.
shape {
    monitor =
    size = 520, 340
    color = $surface
    rounding = 32
    border_size = 1
    border_color = $outline
    shadow_passes = 3
    shadow_size = 18
    shadow_color = $shadow
    shadow_boost = 1.1
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}

# Lock medallion: the wallpaper's accent shows up here and in the field.
shape {
    monitor =
    size = 42, 42
    color = $surfaceAlt
    rounding = -1
    border_size = 1
    border_color = $accent
    position = 0, 130
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = 󰌾
    font_size = 17
    font_family = JetBrains Mono Nerd Font
    color = $accent
    position = 0, 130
    halign = center
    valign = center
    zindex = 2
}

# Portrait: the same photo the login shows (SDDM's FacesDir, the only place
# both can read: the greeter runs as its own user and cannot get into a 0700
# $HOME). It sits ON TOP of the medallion and the padlock, so if the file is
# not there, hyprlock draws nothing here and the usual padlock is still
# underneath. This screen cannot be left with a hole in it.
image {
    monitor =
    path = /usr/share/sddm/faces/diego.face.icon
    size = 48
    rounding = -1
    border_size = 1
    border_color = $accent
    position = 0, 130
    halign = center
    valign = center
    zindex = 3
}

# Clock: proportional like the notch, with tabular figures that do not jiggle.
label {
    monitor =
    text = <span font_features="tnum">$TIME</span>
    font_size = 68
    font_family = Adwaita Sans
    color = $text
    position = 0, 58
    halign = center
    valign = center
    zindex = 2
}

# Date in Spanish regardless of the session's global locale.
label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/lock-info.sh date
    font_size = 15
    font_family = Adwaita Sans
    color = $muted
    position = 0, 4
    halign = center
    valign = center
    zindex = 2
}

# Pill field: active by default; on checking or failing it switches to colours
# that keep their meaning even if pywal produces another palette.
input-field {
    monitor =
    size = 360, 50
    outline_thickness = 2
    dots_size = 0.20
    dots_spacing = 0.38
    dots_center = true
    dots_rounding = -1
    outer_color = $accent
    inner_color = $surfaceAlt
    font_color = $text
    font_family = Adwaita Sans
    fade_on_empty = false
    placeholder_text = <span alpha="55%">$lockPlaceholder</span>
    check_color = $ok
    check_text = $lockCheck
    fail_color = $fail
    fail_text = $lockFail
    capslock_color = $warn
    rounding = -1
    shadow_passes = 1
    shadow_size = 8
    shadow_color = $shadow
    position = 0, -58
    halign = center
    valign = center
    zindex = 2
}

# Island footer: identity on the left and battery on the right.
label {
    monitor =
    text = 󰀄  $USER
    font_size = 12
    font_family = JetBrains Mono Nerd Font
    color = $dim
    position = -154, -124
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:30000] ~/.config/hypr/scripts/lock-info.sh battery
    font_size = 12
    font_family = JetBrains Mono Nerd Font
    color = $dim
    position = 154, -124
    halign = center
    valign = center
    zindex = 2
}
