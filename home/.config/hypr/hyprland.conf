###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Captura de región con la pantalla CONGELADA: también fotografía lo que se
# cierra al perder el foco (el notch de Super+D, un menú, un desplegable).
bind = $mainMod SHIFT, S, exec, ~/.config/hypr/scripts/screenshot-region.sh
# Captura de pantalla COMPLETA instantánea (grim no roba foco → sí captura menús como rofi)
# Super+Shift+P es la tecla FIABLE; Print funciona si tu teclado emite ese keysym.
bind = $mainMod SHIFT, P, exec, ~/.config/hypr/scripts/screenshot-full.sh
bind = , Print, exec, ~/.config/hypr/scripts/screenshot-full.sh
# Bloquear la pantalla manualmente (hyprlock vía hypridle)
bind = $mainMod, L, exec, loginctl lock-session
bind = $mainMod SHIFT, V, global, quickshell:clipboard   # historial de portapapeles (modo # del lanzador del notch)
 

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, Q, exec, uwsm app -- $terminal
bind = $mainMod, C, killactive, 
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, uwsm app -- $fileManager
bind = $mainMod, I, exec, ~/ia-local/bin/ia-panel   # IA local: panel que conoce este sistema (modulo autocontenido)
bind = $mainMod, V, exec, ~/.config/hypr/scripts/toggle-float-centered.sh   # flotante al 60 %, centrada; segunda pulsacion vuelve al mosaico
bind = $mainMod, R, global, quickshell:launcher   # lanzador desplegado desde el notch
bind = $mainMod SHIFT, M, global, quickshell:media   # reproductor flotante
bind = $mainMod, N, global, quickshell:notchstyle   # alterna notch <-> isla
bind = $mainMod SHIFT, W, global, quickshell:wallpaper   # picker wallpaper (local+web)
bind = $mainMod, TAB, global, quickshell:overview   # mapa de escritorios en el notch (arrastrable)
bind = $mainMod, D, global, quickshell:notch   # centro de control en el notch
bind = $mainMod SHIFT, D, global, quickshell:system   # estado del equipo en el notch
bind = $mainMod SHIFT, E, global, quickshell:power   # menú de encendido en el notch
bind = $mainMod, comma, global, quickshell:settings   # app de Ajustes (como Cmd+, en macOS)
bind = $mainMod, A, global, quickshell:settings   # app de Ajustes (A de Ajustes, alias de Super+,)
bind = $mainMod, K, global, quickshell:keybinds   # mapa de atajos (Ajustes > Atajos), antes un rofi aparte

bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit # dwindle
bind = $mainMod, G, exec, ~/.config/quickshell/reload.sh   # recarga Quickshell (barra + notch)
bind = $mainMod, W, global, quickshell:bar   # ocultar/mostrar la barra superior

# Move focus with mainMod + SHIFT + arrow keys
bind = $mainMod SHIFT, left, movefocus, l
bind = $mainMod SHIFT, right, movefocus, r
bind = $mainMod SHIFT, up, movefocus, u
bind = $mainMod SHIFT, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
#bind = $mainMod, S, togglespecialworkspace, magic
#bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
# Volumen/brillo: el OSD lo pinta el notch (Quickshell). El volumen lo detecta
# solo vía Pipewire; el brillo lo cambia el propio notch por IPC para que no haya
# lag ni desfase de valor.
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 2%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bindl = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, qs ipc call notch bright up
bindel = ,XF86MonBrightnessDown, exec, qs ipc call notch bright down

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Al pulsar botón físico de power
bind = , XF86PowerOff, global, quickshell:power   # menú de encendido en el notch

# Mover/intercambiar ventana con Super + Flechas
bind = $mainMod, left, movewindow, l
bind = $mainMod, right, movewindow, r
bind = $mainMod, up, movewindow, u
bind = $mainMod, down, movewindow, d


bind = SUPER, O, exec, kitty --class pokemon-popup -e ~/.config/hypr/scripts/pokemon-popup.sh   # invoca un pokemon animado
##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# --- App de Ajustes de Quickshell (SettingsWindow.qml) ---
# Es la única ventana de verdad (xdg-toplevel) del shell: class org.quickshell,
# título "Ajustes"; el resto del shell son capas (layer-shell) y no pasan por
# aquí. Sin estas reglas se abría TILED y ocupaba media pantalla (952x1038).
# La queremos siempre flotante, contenida y centrada. Si algún día la quieres
# anclada, Super+V la desancla/ancla a mano sin tocar la config.
# El tamaño va también en el QML (implicitWidth/Height) para que no haya un
# fogonazo grande antes de que Hyprland la redimensione. No bajar de 780 de
# ancho: la ventana tiene mínimo propio ahí.
# OJO con la sintaxis: Hyprland 0.53 rehízo las windowrule y la de toda la vida
# ("windowrule = float, class:^(x)$") ya NO vale — da "invalid field float:
# missing a value". Ahora los filtros son campos match:* y los efectos llevan
# valor. El ejemplo comentado de arriba es de la sintaxis vieja.
windowrule {
    name = ajustes-quickshell
    match:class = ^(org\.quickshell)$
    match:title = ^(Ajustes)$

    float = true
    size = 900 620
    center = true
}

# --- Ley 9: una animacion, un dueno ---
# El compositor anima las superficies que APARECEN; la app anima lo de dentro.
#
# La barra/notch de Quickshell es una capa PERMANENTE que se redimensiona sola
# y que ya se anima ella misma (tokens de Appearance.qml). Si ademas la animara
# Hyprland, se encadenarian dos animaciones sobre el mismo gesto y se veria un
# borron. Aqui se le cede el mando a Quickshell.
layerrule = no_anim on, match:namespace ^(quickshell:bar)$

# --- Ley 6 aplicada a las superficies del shell: cada una entra por donde le
# --- corresponde, en vez de un fundido generico para todas.
#
# Esto solo es posible desde que las tres declaran WlrLayershell.namespace (una
# linea en cada .qml). Antes no habia nada a lo que agarrarse y se comian el
# 'layers' global.
#
# El criterio de cada una sale de la ley 9 (una animacion, un dueno): hay que
# mirar QUE anima ya la app por dentro y darle al compositor solo lo que quede
# libre. Si los dos animan lo mismo, los dos fundidos se multiplican y el
# resultado no es el doble de bonito, es que llega tarde.
#
# media: vive pegado al borde de abajo, asi que SUBE desde ahi. 'slide' mueve
# posicion y nada mas -- no funde -- y la tarjeta por dentro ya se encarga de
# la escala y la opacidad. Canales distintos, no se pisan.
layerrule = animation slide bottom, match:namespace ^(quickshell:media)$

# wallpaper: ocupa la pantalla entera, asi que deslizarla ensenaria el borde
# por el que entra. Y ademas su 'stage' ya se funde solo (animMed, OutCubic).
# El compositor no tiene nada que aportar aqui: que se aparte.
layerrule = no_anim on, match:namespace ^(quickshell:wallpaper)$

# overview: esta regla se retira el 6-ago-2026 y NO hay que volver a ponerla.
# El overview ya no es una superficie propia: es una cara del notch, o sea que
# vive dentro de quickshell:bar y su entrada la hace el morfeo de la forma del
# propio notch. Una regla de capa aqui no tendria a que aplicarse.

# Aqui habia dos layerrule (blur + ignore_alpha 0.5) sobre la capa de rofi, que
# era lo unico con transparencia real. Se van con rofi el 19-08-2026: una regla
# que apunta a una capa que ya nadie crea no hace nada salvo hacerte creer que
# rofi sigue en el escritorio.
# (Por si vuelve a hacer falta una regla de capa: la sintaxis posicional de
# antes -- "layerrule = blur, quickshell:bar" -- no la rompio 0.56 sino la
# reescritura de reglas de 0.53; la forma buena hoy es con match:.)

# La sombra dice "esto es lo que estas mirando": SOLO la ventana enfocada la
# proyecta. Junto con dim_inactive, el foco deja de ser un matiz y pasa a ser
# lo primero que ve el ojo al entrar en la pantalla, sin una sola linea de
# borde. (Antes esto era "solo las flotantes", que en un tiling es casi nunca:
# la regla era correcta sobre el papel y en la practica no se veia jamas.)
windowrule = no_shadow on, match:focus 0



# pywal: bordes dinámicos del wallpaper (revertir = comenta la línea source)
source = ~/.cache/wal/colors-hyprland.conf

# Selector de fondos con re-tematizado pywal (Super+Shift+W)

# --- Quick wins ---
bind = $mainMod CTRL, S, exec, ~/.config/hypr/scripts/screenshot-annotate.sh   # anotar captura (satty)
bind = $mainMod SHIFT, C, exec, ~/.config/hypr/scripts/colorpicker.sh          # cuentagotas (hyprpicker)
bind = $mainMod SHIFT, N, exec, ~/.config/hypr/scripts/hyprsunset-toggle.sh    # luz nocturna toggle

# --- Signature: menú/ocr ---
bind = $mainMod ALT, Space, global, quickshell:actions   # menú de comandos (modo > del lanzador del notch)
bind = $mainMod CTRL, T, exec, ~/.config/hypr/scripts/ocr.sh              # OCR de pantalla

# --- Grabar pantalla (wf-recorder) ---
bind = $mainMod CTRL, R, exec, ~/.config/hypr/scripts/screenrecord.sh
