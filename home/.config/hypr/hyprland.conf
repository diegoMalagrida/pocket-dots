### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    # Law 8 — a single gap in the content layer. Between two windows there are
    # 6 px (3 + 3) and up to the edge of the screen, another 6: THE SAME gap.
    # It used to be 6 and 5. One pixel of mismatch cannot be seen, but it can be felt.
    gaps_in = 3
    gaps_out = 6

    # Law 2 — no border, on purpose: focus is marked with light, not with an
    # outline. (Hyprland's factory teal/green colours used to live here; they
    # contradicted the whole palette and were dead anyway, because pywal
    # overrides them further down. Gone.) If one day you want borders: raise
    # this to 2 and they come already themed from ~/.cache/wal/colors-hyprland.conf.
    border_size = 0

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = true

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    # Law 1 — geometry says whose layer it is. Windows are SQUARE (this is
    # yours and it is anchored to the grid); round things belong to the shell
    # and float above. Do not round this "for consistency": consistency comes
    # from motion, not from shape.
    rounding = 0
    rounding_power = 0

    # Law 2 — focus is marked with light. The focused window is FULLY present;
    # the rest sink back. The active one used to be at 0.98: a veil that
    # communicated nothing and also took contrast away from the text, because
    # kitty is already translucent on its own (background_opacity 0.95).
    # dim_inactive darkens instead of making things transparent, which is the
    # clean way for something to recede: transparency lets the background leak in.
    active_opacity = 1.0
    inactive_opacity = 0.90
    dim_inactive = true
    dim_strength = 0.35
    dim_special = 0.5

    # The shadow says "this floats". Tiled windows are stuck to the grid and
    # do not get one (windowrule further down); floating windows and dialogs
    # do. It is information about the plane, not decoration.
    shadow {
        enabled = true
        range = 28
        render_power = 4
        # color: set by pywal (~/.cache/wal/colors-hyprland.conf)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    # At size 3 / passes 1 the blur could not be seen. What benefits is
    # whatever has real transparency: kitty runs at 0.95 opacity, and the
    # background shows through. (This used to say "rofi's menus"; none left.)
    # IF YOU NOTICE STUTTERING: go back to size = 3 / passes = 1 (the old values).
    blur {
        enabled = true
        size = 6
        passes = 2
        noise = 0.01
        vibrancy = 0.1696
        vibrancy_darkness = 0.2
        popups = true
    }

    # Law 5 — whatever CROSSES the screen leaves a trail. Hyprland 0.56 blurs
    # the window in the direction it is moving, while the animation lasts.
    # Here it does not fight with rounding because rounding = 0; with round
    # corners the two shaders exclude each other and corners would go square in transit.
    # 'samples' are the copies averaged along the path: more samples, a
    # smoother and more expensive trail. It does not make the trail longer.
    #
    # CAREFUL, THIS FILE IS THE FALLBACK: the switch in Settings > Appearance
    # > Effects writes efectos.lua, which only hyprland.lua loads. If you end up
    # starting with this .conf, the switch does nothing and this line is in charge.
    motion_blur {
        enabled = true
        samples = 7
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
# ==========================================================================
#  MOTION. The same scale as quickshell/Appearance.qml.
#  Speed is in DECISECONDS: 1.3 = 130 ms. They are literally the same four
#  numbers as the tokens in ~/.config/quickshell/Appearance.qml, so that a
#  window and the notch move to the same pulse.
#
#     RESPONSE   1.3 / 1.3    focus, zoom, border colour
#     CONTENT    2.1 / 1.1    fades
#     PANEL      3.2 / 1.7    layers, moving windows
#     SHAPE      4.4 / 2.2    opening and closing a window
#     TRAVEL     5.0          whatever CROSSES the whole screen
#
#  If something moves here and is not on that scale, it is a bug.
#
#  TRAVEL is the exception: 500 ms, more than SHAPE, because crossing the
#  whole screen is literally the longest journey there is here, and charging
#  it at the price of opening a window reduces it to nothing.
#
#  IT USED TO BE 7.0 WITH A 'frontal' CURVE (0.1,1)(0,1) copied from end-4,
#  on the theory that a brutally front-loaded curve lets you use long
#  durations. On screen it did not work: it read as a jerk followed by a slow
#  drift, and diego described it as "weird". The lesson is that such an
#  extreme curve does not give "fast AND weighty", it gives two gestures stuck
#  together that do not look like the same movement. Normal curve, honest duration.
# ==========================================================================
animations {
    enabled = yes

    # Three curves, and no more. The system's fourth ('entra', the one that
    # bounces) lives ONLY in Quickshell: here everything that moves is big, and
    # by law 5 big things do not bounce. A full-screen bounce shows the edge of
    # the screen and gives the trick away.
    bezier = respuesta, 0.2,  0,    0,    1
    bezier = sale,      0.3,  0,    1,    1
    bezier = forma,     0.23, 1,    0.32, 1
    bezier = entra,     0.16, 1.3,  0.3,  1

    # 'apple': the curve of iOS/macOS transitions. It starts with a little
    # acceleration instead of shooting off -- that is what makes it look like
    # something with mass getting under way -- and then brakes for almost the
    # whole journey. It is the opposite of the 'frontal' I tried before: that
    # one packed 90% of the journey into the first hair and the rest was drift.
    bezier = apple,     0.32, 0.72, 0,    1

    animation = global, 1, 3.2, forma

    # Law 6 — motion has an origin. A tiled window INFLATES in its slot; it
    # does not fly in from an edge. The tiling had already decided the place,
    # and flying in contradicts it.
    animation = windows,     1, 4.4, entra, popin 78%
    animation = windowsIn,   1, 4.4, entra, popin 78%
    # Opening covers 22 points of scale (78->100) and closing only 10 (100->90).
    # Deliberately asymmetric, not careless: opening is an event and deserves a
    # gesture; closing is a dismissal and only has to get out of the way.
    # It used to close at 82%, which is almost the same journey as opening, and
    # that is why the two looked too much alike.
    animation = windowsOut,  1, 2.2, sale,  popin 90%
    animation = windowsMove, 1, 4.4, forma # the live .lua uses the 'mover' spring at 4.4; here only the speed can be mirrored

    animation = fade,       1, 2.1, forma
    animation = fadeIn,     1, 2.1, forma
    animation = fadeOut,    1, 1.1, sale
    animation = fadeSwitch, 1, 2.1, forma
    animation = fadeShadow, 1, 2.1, forma

    # Focus. With follow_mouse = 1 it changes constantly, so the dimming has
    # to be RESPONSE: if it were slow, the whole desktop would flicker every
    # time you move the mouse across a window.
    animation = fadeDim, 1, 1.3, respuesta

    # Layers (the bar and the notch panels, the launcher, notifications): they
    # FADE. Nothing full-screen slides in; it would show the edge it comes in
    # through.
    animation = layers,        1, 3.2, forma, fade
    animation = layersIn,      1, 3.2, forma, fade
    animation = layersOut,     1, 1.7, sale,  fade
    animation = fadeLayersIn,  1, 3.2, forma
    animation = fadeLayersOut, 1, 1.7, sale

    # THE WORKSPACE SWITCH, MACOS STYLE. It goes all the way: 'slide', not 'slidefade'.
    #
    # I got this wrong twice in a row here, both times for the same reason. First
    # I set slidefade 30%, and then on top of that I added "parallax": the
    # incoming one at 20% and the outgoing one at 50%, reasoning that two planes
    # at different distances give depth. On paper that is true. On screen what
    # that percentage does is CUT THE JOURNEY SHORT -- the workspaces moved a
    # hand's width and a fade did the rest of the work. That is why it looked
    # subtle: not that the animation was weak, but that there was hardly any movement.
    #
    # macOS does none of that, and that is why it feels decisive: the two
    # workspaces sit side by side like two adjoining rooms and the screen
    # travels 100% from one side to the other, both at once, with no fade at
    # all. The fade is exactly what gives away that they are two overlapping
    # images; without it, they are a place you leave and another you arrive at.
    #
    # No bounce: it is a displacement, and overshooting would leave a strip of
    # background peeking in from the opposite side right at the end.
    #
    animation = workspaces,    1, 5.0, apple, slide
    animation = workspacesIn,  1, 5.0, apple, slide
    animation = workspacesOut, 1, 5.0, apple, slide
    animation = specialWorkspace,    1, 5.0, apple, slidevert
    animation = specialWorkspaceIn,  1, 5.0, apple, slidevert
    animation = specialWorkspaceOut, 1, 5.0, apple, slidevert

    # Invisible (border_size = 0), but the node exists: keep it off the factory
    # speed so it does not clash the day you switch borders on.
    animation = border, 1, 1.3, respuesta

    # borderangle / shadowangle / glowangle in 'loop' force continuous
    # repainting at 60 Hz even when they are not visible. On an Iris Xe that is
    # decoration paid for in frames. They stay off (law 7: nothing moves for no reason).

    animation = zoomFactor, 1, 1.3, respuesta
}


# --- Always three workspaces ---
# Hyprland destroys a workspace as soon as it is empty, so the indicator row
# changed size by itself: you closed the last window on 3 and its dot
# disappeared. 'persistent' makes them exist even when they are empty.
#
# It is done HERE, and not by painting extra dots in the shell, on purpose: this
# way the three workspaces really exist, so the dot is clickable and takes you
# there. A painted dot that corresponds to nothing would be a decoration telling lies.
#
# They are a MINIMUM, not a cap: if you create 4 (Super+4, or by sending a
# window there) its dot appears by itself, and disappears once it is empty. The
# first three always stay.
#
# WITH TWO SCREENS the numbering is still unique for the whole session:
# workspaces are not duplicated per monitor. Hyprland gives each output one at
# startup and shares out the remaining persistent ones, so Super+2 from the
# left screen may take the FOCUS to the right one. That is stock behaviour, not
# a bug, and the bar now only paints the workspaces of ITS OWN screen.
# To split them by hand, add the monitor (names from `hyprctl monitors`):
#   workspace = 1, persistent:true, monitor:DP-4
workspace = 1, persistent:true
workspace = 2, persistent:true
workspace = 3, persistent:true

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    # removed obsolete option: pseudotile = true
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(

    # From caelestia: animate STATE CHANGES, not live interaction.
    # Dragging or resizing with the mouse already follows your hand 1:1, so
    # animating it adds nothing, and on an iGPU it means continuous repainting
    # tied to the pointer (the most expensive path there is). Not a pinch of
    # feel is lost and GPU is freed right when it is most needed.
    animate_manual_resizes = false
    animate_mouse_windowdragging = false
    
}


