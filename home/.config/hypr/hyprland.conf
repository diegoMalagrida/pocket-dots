# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    # Ley 8 — un solo hueco en la capa de contenido. Entre dos ventanas quedan
    # 6 px (3 + 3) y hasta el borde de la pantalla, otros 6: EL MISMO hueco.
    # Antes eran 6 y 5. Un pixel de desajuste no se ve, pero se siente.
    gaps_in = 3
    gaps_out = 6

    # Ley 2 — sin borde, a proposito: el foco se marca con luz, no con
    # contorno. (Aqui vivian los colores teal/verde de fabrica de Hyprland,
    # que contradecian toda la paleta y ademas estaban muertos porque pywal
    # los pisa mas abajo. Fuera.) Si algun dia quieres bordes: sube esto a 2
    # y ya vienen tematizados desde ~/.cache/wal/colors-hyprland.conf.
    border_size = 0

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = true

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    # Ley 1 — la geometria dice de quien es la capa. Las ventanas van RECTAS
    # (esto es tuyo y esta anclado a la rejilla); lo redondo es del shell y
    # flota por encima. No redondear esto "por coherencia": la coherencia la
    # da el movimiento, no la forma.
    rounding = 0
    rounding_power = 0

    # Ley 2 — el foco se marca con luz. La ventana enfocada esta PLENAMENTE
    # presente; las demas se hunden. Antes la activa estaba a 0.98: un velo
    # que no comunicaba nada y que ademas restaba contraste al texto, porque
    # kitty ya es translucido de por si (background_opacity 0.95).
    # dim_inactive oscurece en vez de transparentar, que es la forma limpia de
    # que algo retroceda: transparentar deja el fondo colandose entre letras.
    active_opacity = 1.0
    inactive_opacity = 0.90
    dim_inactive = true
    dim_strength = 0.35
    dim_special = 0.5

    # La sombra dice "esto flota". Las ventanas en mosaico estan pegadas a la
    # rejilla y no la llevan (windowrule mas abajo); las flotantes y los
    # dialogos si. Es informacion sobre el plano, no adorno.
    shadow {
        enabled = true
        range = 28
        render_power = 4
        # color: lo pone pywal (~/.cache/wal/colors-hyprland.conf)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    # A size 3 / passes 1 el desenfoque no se veia. Lo que se beneficia es
    # lo que tiene transparencia de verdad: kitty va a 0.95 de opacidad, y por
    # ahi se ve el fondo. (Aqui ponia "los menus de rofi"; ya no hay.)
    # SI NOTAS TIRONES: vuelve a size = 3 / passes = 1 (era lo de antes).
    blur {
        enabled = true
        size = 6
        passes = 2
        noise = 0.01
        vibrancy = 0.1696
        vibrancy_darkness = 0.2
        popups = true
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
# ==========================================================================
#  MOVIMIENTO. La spec completa esta en ~/.config/motion-language.md
#  La velocidad va en DECISEGUNDOS: 1.3 = 130 ms. Son literalmente los mismos
#  cuatro numeros que los tokens de ~/.config/quickshell/Appearance.qml, para
#  que una ventana y el notch se muevan con el mismo pulso.
#
#     RESPUESTA  1.3 / 1.3    foco, zoom, color de borde
#     CONTENIDO  2.1 / 1.1    fundidos
#     PANEL      3.2 / 1.7    capas, mover ventanas
#     FORMA      4.4 / 2.2    abrir y cerrar una ventana
#     RECORRIDO  5.0          lo que ATRAVIESA la pantalla entera
#
#  Si algo se mueve aqui y no esta en esa escala, es un bug.
#
#  RECORRIDO es la excepcion: 500 ms, mas que FORMA, porque atravesar la
#  pantalla entera es literalmente el viaje mas largo que existe aqui y
#  cobrarlo al precio de abrir una ventana lo deja en nada.
#
#  ANTES ESTUVO EN 7.0 CON UNA CURVA 'frontal' (0.1,1)(0,1) copiada de end-4,
#  con la teoria de que una curva brutalmente adelantada deja usar duraciones
#  largas. En pantalla no funciono: se leia como un tiron seguido de una deriva
#  lenta, y diego lo describio como "raro". La leccion es que una curva tan
#  extrema no da "rapido Y con peso", da dos gestos pegados que no parecen el
#  mismo movimiento. Curva normal y duracion honesta.
# ==========================================================================
animations {
    enabled = yes

    # Tres curvas, y ninguna mas. La cuarta del sistema ('entra', la que
    # rebota) vive SOLO en Quickshell: aqui todo lo que se mueve es grande, y
    # por ley 5 lo grande no rebota. Un rebote a pantalla completa ensena el
    # borde de la pantalla y delata el truco.
    bezier = respuesta, 0.2,  0,    0,    1
    bezier = sale,      0.3,  0,    1,    1
    bezier = forma,     0.23, 1,    0.32, 1
    bezier = entra,     0.16, 1.3,  0.3,  1

    # 'apple': la curva de las transiciones de iOS/macOS. Arranca con un poco
    # de aceleracion en vez de salir disparada -- eso es lo que hace que parezca
    # que algo con masa se pone en marcha -- y despues frena durante casi todo
    # el recorrido. Es lo contrario de la 'frontal' que probe antes: aquella
    # metia el 90% del viaje en el primer pelin y el resto era deriva.
    bezier = apple,     0.32, 0.72, 0,    1

    animation = global, 1, 3.2, forma

    # Ley 6 — el movimiento tiene origen. Una ventana en mosaico se INFLA en
    # su hueco; no vuela desde un borde. El sitio ya lo habia decidido el
    # tiling, y entrar volando lo desmiente.
    animation = windows,     1, 4.4, entra, popin 78%
    animation = windowsIn,   1, 4.4, entra, popin 78%
    # Abrir recorre 22 puntos de escala (78->100) y cerrar solo 10 (100->90).
    # Deliberadamente asimetrico, no descuidado: abrir es un acontecimiento y
    # merece gesto; cerrar es un descarte y solo tiene que quitarse de en medio.
    # Antes cerraba al 82%, que es casi el mismo viaje que la apertura, y por
    # eso las dos cosas se parecian demasiado.
    animation = windowsOut,  1, 2.2, sale,  popin 90%
    animation = windowsMove, 1, 3.2, forma

    animation = fade,       1, 2.1, forma
    animation = fadeIn,     1, 2.1, forma
    animation = fadeOut,    1, 1.1, sale
    animation = fadeSwitch, 1, 2.1, forma
    animation = fadeShadow, 1, 2.1, forma

    # El foco. Con follow_mouse = 1 cambia constantemente, asi que la
    # atenuacion tiene que ser RESPUESTA: si tardara, el escritorio entero
    # temblaria cada vez que cruzas el raton por encima de una ventana.
    animation = fadeDim, 1, 1.3, respuesta

    # Capas (la barra y los paneles del notch, el lanzador, los avisos): se
    # FUNDEN. Nada a pantalla completa entra deslizandose, ensenaria el borde
    # por el que entra.
    animation = layers,        1, 3.2, forma, fade
    animation = layersIn,      1, 3.2, forma, fade
    animation = layersOut,     1, 1.7, sale,  fade
    animation = fadeLayersIn,  1, 3.2, forma
    animation = fadeLayersOut, 1, 1.7, sale

    # EL CAMBIO DE ESCRITORIO, ESTILO MACOS. Va entero: 'slide', no 'slidefade'.
    #
    # Aqui me equivoque dos veces seguidas y las dos por lo mismo. Primero puse
    # slidefade 30%, y luego encima le meti "paralaje": la que entra 20% y la
    # que sale 50%, razonando que dos planos a distinta distancia dan
    # profundidad. Sobre el papel es cierto. En pantalla lo que hace ese
    # porcentaje es RECORTAR EL VIAJE -- los escritorios se movian medio palmo
    # y el resto del trabajo lo hacia un fundido. Por eso se veia sutil: no es
    # que la animacion fuera floja, es que casi no habia desplazamiento.
    #
    # macOS no hace nada de eso y por eso se siente contundente: los dos
    # escritorios estan pegados como dos habitaciones contiguas y la pantalla
    # viaja el 100% de un lado al otro, a la vez, sin fundido ninguno. El
    # fundido es justo lo que delata que son dos imagenes superpuestas; sin el,
    # son un sitio del que te vas y otro al que llegas.
    #
    # Sin rebote: es un desplazamiento, y pasarse dejaria una franja de fondo
    # asomando por el lado contrario justo al final.
    #
    animation = workspaces,    1, 5.0, apple, slide
    animation = workspacesIn,  1, 5.0, apple, slide
    animation = workspacesOut, 1, 5.0, apple, slide
    animation = specialWorkspace,    1, 5.0, apple, slidevert
    animation = specialWorkspaceIn,  1, 5.0, apple, slidevert
    animation = specialWorkspaceOut, 1, 5.0, apple, slidevert

    # Invisible (border_size = 0), pero el nodo existe: que no se quede en la
    # velocidad de fabrica y desentone el dia que enciendas los bordes.
    animation = border, 1, 1.3, respuesta

    # borderangle / shadowangle / glowangle en 'loop' fuerzan repintado
    # continuo a 60 Hz aunque no se vean. En una Iris Xe eso es adorno que se
    # paga en fotogramas. Se quedan apagados (ley 7: nada se mueve porque si).

    animation = zoomFactor, 1, 1.3, respuesta
}


# --- Siempre tres escritorios ---
# Hyprland destruye un escritorio en cuanto se queda vacio, asi que la fila del
# indicador cambiaba de tamano sola: cerrabas la ultima ventana del 3 y el punto
# desaparecia. 'persistent' hace que existan aunque esten vacios.
#
# Se hace AQUI y no pintando puntos de mas en el shell a proposito: asi los tres
# escritorios existen de verdad, o sea que el punto es clicable y te lleva a el.
# Un punto pintado que no corresponde a nada seria un adorno mintiendo.
#
# Son un MINIMO, no un tope: si creas el 4 (Super+4, o mandando una ventana
# alli) aparece su punto solo, y desaparece al vaciarlo. Los tres primeros se
# quedan siempre.
#
# CON DOS PANTALLAS la numeracion sigue siendo unica para toda la sesion: los
# escritorios no se duplican por monitor. Hyprland le da uno a cada salida al
# arrancar y reparte los persistentes que sobran, asi que Super+2 desde la
# pantalla izquierda puede llevarte el FOCO a la derecha. Es de serie, no un
# fallo, y la barra ya solo pinta los escritorios de SU pantalla.
# Para repartirlos a mano se le anade el monitor (nombres de `hyprctl monitors`):
#   workspace = 1, persistent:true, monitor:DP-4
workspace = 1, persistent:true
workspace = 2, persistent:true
workspace = 3, persistent:true

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    # removed obsolete option: pseudotile = true
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(

    # De caelestia: se animan los CAMBIOS DE ESTADO, no la interaccion en vivo.
    # Arrastrar o redimensionar con el raton ya va 1:1 con tu mano, asi que
    # animarlo no aporta nada y en una iGPU es repintado continuo atado al
    # puntero (el camino mas caro que hay). No se pierde ni una pizca de
    # sensacion y se libera GPU justo cuando mas falta hace.
    animate_manual_resizes = false
    animate_mouse_windowdragging = false
    
}


