# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# --- Quickshell's Settings app (SettingsWindow.qml) ---
# It is the shell's only real window (xdg-toplevel): class org.quickshell,
# title "Ajustes"; the rest of the shell is layers (layer-shell), which do not
# go through here. Without these rules it opened TILED and took up half the
# screen (952x1038). We want it always floating, contained and centred. If one
# day you want it anchored, Super+V unanchors/anchors it by hand, no config change.
# The size is also in the QML (implicitWidth/Height) so there is no big flash
# before Hyprland resizes it. Do not go below 780 wide: the window has its own
# minimum there.
# CAREFUL with the syntax: Hyprland 0.53 reworked windowrules and the classic
# form ("windowrule = float, class:^(x)$") NO LONGER works — it gives "invalid
# field float: missing a value". Now the filters are match:* fields and the
# effects take a value. The commented-out example above is the old syntax.
windowrule {
    name = ajustes-quickshell
    match:class = ^(org\.quickshell)$
    match:title = ^(Ajustes)$

    float = true
    size = 900 620
    center = true
}

# --- The Super+O Pokédex (pokemon-popup.py inside kitty) ---
# Without this rule it went into the TILING: it rearranged your whole
# workspace and also drew a 700 px card lost in an 1880 window, with black
# emptiness all around. It opens from a shortcut and goes away with any key,
# so it is a dialog, not a work window: floating and centred, with the SAME
# width as Settings. The height comes from laying out the card for all 563
# critters (remeasured 2026-09-14 for the grid card): the longest takes 733 px
# and kitty's chrome plus the footer take ~100, so with 840 they all fit without
# scrolling; the scroll is still there in case someone shrinks the window by hand.
windowrule {
    name = pokedex-popup
    match:class = ^(pokemon-popup)$

    float = true
    size = 900 840
    center = true
}

# --- Image viewer (imv) ---
# Looking at a photo is not settling down to work: it went into the tiling and
# rearranged your whole workspace to show something you close ten seconds
# later. Same criterion as Settings and the Pokédex, which also come out of a gesture and go away.
# 1344x756 is 70 % of this screen. It is in PIXELS and not a percentage because
# `size = 70% 70%` is accepted without complaint and does nothing: the window
# comes up at imv's 1280x720 (checked on 2026-09-25).
windowrule {
    name = imv-flotante
    match:class = ^(imv)$

    float = true
    size = 1344 756
    center = true
}

# --- Law 9: one animation, one owner ---
# The compositor animates surfaces that APPEAR; the app animates what is inside.
#
# Quickshell's bar/notch is a PERMANENT layer that resizes itself and already
# animates itself (Appearance.qml tokens). If Hyprland animated it as well,
# two animations would chain on the same gesture and you would see a smear.
# Here control is handed over to Quickshell.
layerrule = no_anim on, match:namespace ^(quickshell:bar)$

# --- Law 6 applied to the shell's surfaces: each one comes in from where it
# --- belongs, instead of one generic fade for all of them.
#
# This is only possible since all three declare WlrLayershell.namespace (one
# line in each .qml). Before, there was nothing to hold on to and they got the
# global 'layers'.
#
# The criterion for each one comes from law 9 (one animation, one owner): look
# at WHAT the app already animates inside and give the compositor only whatever
# is left free. If both animate the same thing, the two fades multiply and the
# result is not twice as pretty, it is just late.
#
# media: it lives stuck to the bottom edge, so it RISES from there. 'slide'
# moves position and nothing else -- it does not fade -- and the card inside
# already handles scale and opacity. Different channels, no overlap.
layerrule = animation slide bottom, match:namespace ^(quickshell:media)$

# wallpaper: it covers the whole screen, so sliding it would show the edge it
# comes in through. Besides, its 'stage' already fades by itself (animMed,
# OutCubic). The compositor has nothing to add here: let it step aside.
layerrule = no_anim on, match:namespace ^(quickshell:wallpaper)$

# overview: this rule was retired on 6 Aug 2026 and must NOT be put back.
# The overview is no longer a surface of its own: it is a face of the notch, so
# it lives inside quickshell:bar and its entrance is done by the notch's own
# shape morph. A layer rule here would have nothing to apply to.

# There were two layerrules here (blur + ignore_alpha 0.5) on rofi's layer, which
# was the only thing with real transparency. They went with rofi on 19 Aug 2026:
# a rule pointing at a layer nobody creates any more does nothing except make
# you believe rofi is still on the desktop.
# (In case a layer rule is ever needed again: the old positional syntax
# -- "layerrule = blur, quickshell:bar" -- was not broken by 0.56 but by the
# rule rewrite in 0.53; the right form today uses match:.)

# The shadow says "this is what you are looking at": ONLY the focused window
# casts it. Together with dim_inactive, focus stops being a nuance and becomes
# the first thing the eye sees on arriving at the screen, without a single
# line of border. (Before, this was "only the floating ones", which in tiling
# is almost never: the rule was right on paper and in practice never seen.)
windowrule = no_shadow on, match:focus 0



# pywal: dynamic borders from the wallpaper (to revert, comment out the source line)
source = ~/.cache/wal/colors-hyprland.conf

# Wallpaper picker with pywal re-theming (Super+Shift+W)

# --- Quick wins ---
bind = $mainMod CTRL, S, exec, ~/.config/hypr/scripts/screenshot-annotate.sh   # anotar captura (satty)
bind = $mainMod SHIFT, C, exec, ~/.config/hypr/scripts/colorpicker.sh          # cuentagotas (hyprpicker)
bind = $mainMod SHIFT, N, exec, ~/.config/hypr/scripts/hyprsunset-toggle.sh    # luz nocturna toggle

# --- Signature: menu/ocr ---
bind = $mainMod ALT, Space, global, quickshell:actions   # menú de comandos (modo > del lanzador del notch)
bind = $mainMod CTRL, T, exec, ~/.config/hypr/scripts/ocr.sh              # OCR de pantalla

# --- Screen recording (wf-recorder) ---
bind = $mainMod CTRL, R, exec, ~/.config/hypr/scripts/screenrecord.sh
# The same recording but with the sound from the speakers (not the mic). On a
# separate key: a quick recording should not take your music without asking.
bind = $mainMod CTRL SHIFT, R, exec, ~/.config/hypr/scripts/screenrecord.sh --sonido
