### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
#
# WILDCARD rule on purpose: it works the same for the laptop (eDP-1) as for the
# tower (DP-4 + DP-6) without touching anything. 'preferred' takes each output's
# native mode and 'auto' places them one to the right of the other in the order
# they appear. Hard-coded names, never: they would only work on one of the two.
monitor=,preferred,auto,1

# To fine-tune on a particular machine, add NAMED rules below the wildcard (the
# last one that matches wins). The names come from `hyprctl monitors` and the
# position is the top-left corner in already scaled pixels:
#
#   monitor=DP-4,preferred,0x0,1
#   monitor=DP-6,preferred,2560x0,1


