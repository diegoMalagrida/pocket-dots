# https://wiki.hypr.land/Configuring/Variables/#input
input {
    # Per machine: install.sh may write ~/.config/hypr/keyboard.lua with the
    # layout localectl reports, and hyprland.lua loads it over this one.
    kb_layout = es
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# CAREFUL if you ever fall back to this file: the 3-finger-down gesture that
# opens the calendar is NOT in this file. It lives only in hyprland.lua, because
# it uses a table of callbacks (`action = { finish = function() ... end }`) that
# the classic .conf syntax does not have. No by-eye translation has been written
# here: without being able to test it -that would mean removing the .lua and
# reloading the whole session- it would be a line that looks like it works and
# does not. If you come back to this file, that gesture is the only thing you
# will miss; the control centre tile still opens the calendar just the same.

###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# SUPER+n on the workspace you are already on takes you back to the previous
# one, instead of doing nothing. The compositor does it, not a counter of ours:
# the binds below dispatch the bare `workspace`, which is the one this option looks at.
binds {
    workspace_back_and_forth = true
}

# Region capture with the screen FROZEN: it also captures whatever closes when
# it loses focus (the Super+D notch, a menu, a dropdown).
bind = $mainMod SHIFT, S, exec, ~/.config/hypr/scripts/screenshot-region.sh
# Instant FULL screenshot (grim does not steal focus → it does capture menus like rofi)
# Super+Shift+P is the RELIABLE key; Print works if your keyboard emits that keysym.
bind = $mainMod SHIFT, P, exec, ~/.config/hypr/scripts/screenshot-full.sh
bind = , Print, exec, ~/.config/hypr/scripts/screenshot-full.sh
# Lock the screen manually (hyprlock via hypridle)
bind = $mainMod, L, exec, loginctl lock-session
bind = $mainMod SHIFT, V, global, quickshell:clipboard   # historial de portapapeles (modo # del lanzador del notch)
 

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, Q, exec, uwsm app -- $terminal
bind = $mainMod, C, killactive, 
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, uwsm app -- $fileManager
# CONDITIONAL, and the mirror has to say so. The .lua only REGISTERS this bind
# if ~/ia-local/bin/ia-panel exists (hyprland.lua:576-582, with io.open), so
# that deleting the module does not leave a dead Super+I that looks like it
# works. That module is separate and does NOT travel in this repo, so on a
# freshly cloned machine the shortcut will not be there, however much it shows up in this list.
#
# It is left UNCOMMENTED on purpose: Settings > Shortcuts parses this file and
# its regex requires the line to start with `bind` (SettingsShortcuts.qml:68),
# so commenting it out would remove it from the list on machines where it DOES exist.
bind = $mainMod, I, exec, ~/ia-local/bin/ia-panel   # IA local: panel que conoce este sistema (modulo aparte)
bind = $mainMod, V, exec, ~/.config/hypr/scripts/toggle-float-centered.sh   # flotante al 60 %, centrada; segunda pulsacion vuelve al mosaico
bind = $mainMod, R, global, quickshell:launcher   # lanzador desplegado desde el notch
bind = $mainMod SHIFT, M, global, quickshell:media   # reproductor flotante
bind = $mainMod, N, global, quickshell:notchstyle   # alterna notch <-> isla
bind = $mainMod SHIFT, W, global, quickshell:wallpaper   # picker wallpaper (local+web)
bind = $mainMod, TAB, global, quickshell:overview   # mapa de escritorios en el notch (arrastrable)
bind = $mainMod, D, global, quickshell:notch   # centro de control en el notch
bind = $mainMod SHIFT, D, global, quickshell:system   # estado del equipo en el notch
bind = $mainMod SHIFT, E, global, quickshell:power   # menú de encendido en el notch
bind = $mainMod SHIFT, O, global, quickshell:poke   # equipo pokémon en el notch
bind = $mainMod, comma, global, quickshell:settings   # app de Ajustes (como Cmd+, en macOS)
bind = $mainMod, A, global, quickshell:settings   # app de Ajustes (A de Ajustes, alias de Super+,)
bind = $mainMod, K, global, quickshell:keybinds   # mapa de atajos (Ajustes > Atajos), antes un rofi aparte

bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit # dwindle
bind = $mainMod, G, exec, ~/.config/quickshell/reload.sh   # recarga Quickshell (barra + notch)
bind = $mainMod, W, global, quickshell:bar   # ocultar/mostrar la barra superior

# Move focus with mainMod + SHIFT + arrow keys
bind = $mainMod SHIFT, left, movefocus, l
bind = $mainMod SHIFT, right, movefocus, r
bind = $mainMod SHIFT, up, movefocus, u
bind = $mainMod SHIFT, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
#bind = $mainMod, S, togglespecialworkspace, magic
#bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
# Volume/brightness: the notch (Quickshell) paints the OSD. It picks up the
# volume by itself via Pipewire; the brightness is changed by the notch itself
# over IPC so there is no lag and no value mismatch.
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 2%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bindl = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, qs ipc call notch bright up
bindel = ,XF86MonBrightnessDown, exec, qs ipc call notch bright down

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# On pressing the physical power button
bind = , XF86PowerOff, global, quickshell:power   # menú de encendido en el notch

# Move/swap window with Super + Arrows
bind = $mainMod, left, movewindow, l
bind = $mainMod, right, movewindow, r
bind = $mainMod, up, movewindow, u
bind = $mainMod, down, movewindow, d


bind = SUPER, O, exec, kitty --class pokemon-popup -e ~/.config/hypr/scripts/pokemon-popup.sh   # invoca un pokemon animado
