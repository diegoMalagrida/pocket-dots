################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
#
# Regla COMODIN a proposito: sirve igual para el portatil (eDP-1) que para la
# torre (DP-4 + DP-6) sin tocar nada. 'preferred' coge el modo nativo de cada
# salida y 'auto' las coloca una a la derecha de otra en el orden en que
# aparecen. Nombres a fuego, nunca: solo funcionarian en una de las dos maquinas.
monitor=,preferred,auto,1

# Para afinar en un equipo concreto se anaden reglas CON NOMBRE debajo de la
# comodin (la ultima que encaja manda). Los nombres salen de `hyprctl monitors`
# y la posicion es la esquina superior izquierda en pixeles ya escalados:
#
#   monitor=DP-4,preferred,0x0,1
#   monitor=DP-6,preferred,2560x0,1


###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = nautilus


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# UWSM exporta el entorno de sesión a D-Bus y systemd.
# exec-once = waybar   # sustituida por MenuBar.qml + Notch.qml de Quickshell
exec-once = ~/.config/hypr/awww-start.sh
# Quickshell (barra + notch) lo supervisa quickshell.service: si peta, systemd lo levanta.
# Hypridle y el agente PolicyKit quedan supervisados por sus servicios de usuario.
exec-once = wl-paste --type text --watch cliphist store     # historial de portapapeles (texto)
exec-once = wl-paste --type image --watch cliphist store    # historial de portapapeles (imágenes)



