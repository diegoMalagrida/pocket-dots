#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# UWSM exports the session environment to D-Bus and systemd.
# exec-once = waybar   # replaced by Quickshell's MenuBar.qml + Notch.qml
exec-once = ~/.config/hypr/awww-start.sh
# Quickshell (bar + notch) is supervised by quickshell.service: if it crashes, systemd brings it back up.
# Hypridle and the PolicyKit agent are supervised by their user services.
exec-once = wl-paste --type text --watch cliphist store     # clipboard history (text)
exec-once = wl-paste --type image --watch cliphist store    # clipboard history (images)

# Shake to find: loads the dynamic-cursors plugin, pinned to this Hyprland
# version. Mirror of hyprland.lua (line 75).
# ADDED ON 14 Sep 2026: it was missing. Starting from this fallback .conf left
# the desktop WITHOUT shake-to-find and without the plugin config further down,
# just as happened with the cursor before the cursor { } block was added.
exec-once = ~/.config/hypr/scripts/dynamic-cursors.sh



#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,19
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_SIZE,19

# Mirror of hyprland.lua: hyprcursor switched OFF on purpose. Bibata's SVG
# theme is installed so that the shake-to-find zoom comes out crisp, but if
# Hyprland also uses it for the NORMAL cursor, that cursor stops being the usual
# bitmap XCursor and you notice straight away. The plugin is patched to load
# the SVG on its own, so it is not needed here.
# WITHOUT THIS LINE, starting from this fallback .conf changes the cursor.
cursor {
    enable_hyprcursor = false
}

# Mirror of the pcall block in hyprland.lua (lines 417-432). ADDED ON 14 Sep 2026:
# it was missing, so starting from this .conf loaded the plugin with its DEFAULTS,
# and the default mode is "tilt" -- the cursor tilting as it moves, which is not
# what Diego wants.
# CAREFUL WITH SYNTAX: here it takes a HYPHEN (dynamic-cursors). In the .lua it is
# an underscore (dynamic_cursors), because Lua does not allow hyphens in keys and
# the bridge translates it. The wrong way round gives "unknown config key" either way.
# "smooth" profile: threshold 3 detects the first back-and-forth, influence 2 makes
# the zoom grow WITH the intensity of the shaking, timeout 0 deflates it on release.
plugin {
    dynamic-cursors {
        mode = none
        shake {
            threshold = 3.0
            base = 2.0
            speed = 2.0
            influence = 2.0
            limit = 4.0
            timeout = 0
        }
        # nearest 0: never pixelated scaling. resolution 128: the SVG theme is
        # rasterised at 128 px, crisp across the whole zoom range (19 px x 4 = 76).
        hyprcursor {
            nearest = 0
            resolution = 128
        }
    }
}




