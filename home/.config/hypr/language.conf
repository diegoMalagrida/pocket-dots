# language.es.conf — los textos de la isla de bloqueo, en castellano.
#
# Este fichero no lo carga nadie directamente: el instalador copia el que toque
# (este o language.en.conf) encima de language.conf, que es el que hyprlock
# carga con `source` y el que leen los scripts a traves de scripts/lang.sh.
#
# Si anades un texto aqui, anadelo TAMBIEN en language.en.conf y define su
# valor castellano dentro de hyprlock.conf antes del `source`, que es lo que
# salva la pantalla si este fichero falta.

$uiLang = es

$lockPlaceholder = Escribe tu contraseña
$lockCheck = Comprobando…
$lockFail = No coincide · intento $ATTEMPTS
