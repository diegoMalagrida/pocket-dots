# language.en.conf — the lock island's text, in English.
#
# Nothing loads this file directly: the installer copies whichever one applies
# (this or language.es.conf) over language.conf, which is the file hyprlock
# pulls in with `source` and the one the scripts read through scripts/lang.sh.
#
# If you add a string here, add it to language.es.conf too, and give it a
# Spanish value inside hyprlock.conf before the `source` — that fallback is
# what saves the lock screen if this file goes missing.

$uiLang = en

$lockPlaceholder = Enter your password
$lockCheck = Checking…
$lockFail = No match · attempt $ATTEMPTS
