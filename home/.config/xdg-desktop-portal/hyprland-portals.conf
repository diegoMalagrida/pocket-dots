[preferred]
default = hyprland;gtk
# FileChooser: do NOT put kde. xdg-desktop-portal-kde takes 25 s to register on
# the bus (D-Bus timeout) and meanwhile the portal frontend answers NOBODY ->
# every Qt app that queries org.freedesktop.portal.Settings at start-up gets
# stuck: that is why Quickshell's bar and notch took ~26 s to appear after a
# reboot. With gtk the portal answers in 0.2 s.
org.freedesktop.impl.portal.FileChooser = gtk
# RemoteDesktop: xdg-desktop-portal-hyprland does NOT implement this interface
# (issue hyprwm/xdg-desktop-portal-hyprland#252, open since 2024-08). Without it
# RustDesk fails with "No such interface org.freedesktop.portal.RemoteDesktop".
# luminous is the only backend for wlroots compositors that implements it.
# ScreenCast to luminous as well: RustDesk creates the session via RemoteDesktop
# and then asks for the video source through ScreenCast REUSING that
# session_handle. With ScreenCast on hyprland, that backend does not know the
# luminous session and returns response=2 -> "Failed to obtain screen capture".
# Both interfaces have to be served by the same backend.
#
# ---------------------------------------------------------------------------
# BY DEFAULT THIS GOES TO HYPRLAND, NOT TO LUMINOUS. It is deliberate and it is
# for security. The luminous chain comes with `luminous-autoselect.service`,
# which answers {"type":"success","index":0} to EVERY capture request: that is,
# any program that asks to record the screen gets it WITHOUT ASKING, and always
# output 0 -- on a machine with two monitors there is no way to pick the
# second. That price was accepted for a travel laptop with RustDesk, but it is
# a bad default for anyone else, and this repo is public.
#
# With hyprland you get the usual picker: it asks you, and you choose which
# screen or which window you share.
#
# TO GET RUSTDESK BACK: uncomment the two `luminous` lines below, comment out
# the two `hyprland` ones, and enable the service with
#     systemctl --user enable --now luminous-autoselect.service
# Read the paragraph above first, because from that moment on nobody will ask
# you again before recording your screen.
# ---------------------------------------------------------------------------
org.freedesktop.impl.portal.RemoteDesktop = hyprland
org.freedesktop.impl.portal.ScreenCast = hyprland
#org.freedesktop.impl.portal.RemoteDesktop = luminous
#org.freedesktop.impl.portal.ScreenCast = luminous
