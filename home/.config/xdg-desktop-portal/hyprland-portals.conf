[preferred]
default = hyprland;gtk
# FileChooser: NO poner kde. xdg-desktop-portal-kde tarda 25 s en registrarse en
# el bus (timeout D-Bus) y mientras tanto el frontend del portal no responde a
# NADIE -> toda app Qt que consulte org.freedesktop.portal.Settings al arrancar
# se queda bloqueada: por eso la barra y el notch de Quickshell tardaban ~26 s
# en salir tras reiniciar. Con gtk el portal responde en 0,2 s.
org.freedesktop.impl.portal.FileChooser = gtk
# RemoteDesktop: xdg-desktop-portal-hyprland NO implementa esta interfaz
# (issue hyprwm/xdg-desktop-portal-hyprland#252, abierta desde 2024-08). Sin ella
# RustDesk falla con "No such interface org.freedesktop.portal.RemoteDesktop".
# luminous es el unico backend para compositores wlroots que la implementa.
# ScreenCast tambien a luminous: RustDesk crea la sesion via RemoteDesktop y
# luego pide la fuente de video por ScreenCast REUTILIZANDO ese session_handle.
# Con ScreenCast en hyprland, ese backend no conoce la sesion de luminous y
# devuelve response=2 -> "Failed to obtain screen capture". Ambas interfaces
# tienen que estar servidas por el mismo backend.
#
# ---------------------------------------------------------------------------
# POR DEFECTO ESTO VA A HYPRLAND, NO A LUMINOUS. Es deliberado y es por
# seguridad. La cadena de luminous se acompana de `luminous-autoselect.service`,
# que responde {"type":"success","index":0} a TODA peticion de captura: o sea
# que cualquier programa que pida grabar la pantalla la obtiene SIN PREGUNTAR,
# y siempre la salida 0 -- en un equipo de dos monitores no hay forma de elegir
# el segundo. Ese precio se acepto para un portatil de viaje con RustDesk, pero
# es un mal reglado por defecto para cualquier otro, y este repo es publico.
#
# Con hyprland sale el selector de siempre: te pregunta, y eliges que pantalla
# o que ventana compartes.
#
# PARA RECUPERAR RUSTDESK: descomenta las dos lineas `luminous` de abajo,
# comenta las dos de `hyprland`, y activa el servicio con
#     systemctl --user enable --now luminous-autoselect.service
# Lee antes el parrafo de arriba, porque a partir de ese momento nadie te
# volvera a preguntar antes de grabarte la pantalla.
# ---------------------------------------------------------------------------
org.freedesktop.impl.portal.RemoteDesktop = hyprland
org.freedesktop.impl.portal.ScreenCast = hyprland
#org.freedesktop.impl.portal.RemoteDesktop = luminous
#org.freedesktop.impl.portal.ScreenCast = luminous
