# Boot login = the hyprlock island. It goes in as a drop-in so as not to touch
# /etc/sddm.conf: delete this file and you are back on the previous theme
# (silent).

[Theme]
Current=hyprisland

[General]
# QML_XHR_ALLOW_FILE_READ=1 is not optional: without it Qt 6 SILENTLY blocks
# reading local files from QML (no exception, no callback), and the island's
# battery indicator stays empty forever.
GreeterEnvironment=QML_XHR_ALLOW_FILE_READ=1
# The theme does not use a virtual keyboard; the one from `silent` was
# superfluous here.
InputMethod=
