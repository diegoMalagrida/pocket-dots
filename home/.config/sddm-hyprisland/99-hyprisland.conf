# Login de arranque = la isla de hyprlock. Va como drop-in para no tocar
# /etc/sddm.conf: borrando este fichero se vuelve al tema anterior (silent).

[Theme]
Current=hyprisland

[General]
# QML_XHR_ALLOW_FILE_READ=1 no es opcional: sin ella Qt 6 bloquea EN SILENCIO
# la lectura de ficheros locales desde QML (ni excepcion ni callback), y el
# indicador de bateria de la isla se queda vacio para siempre.
GreeterEnvironment=QML_XHR_ALLOW_FILE_READ=1
# El tema no usa teclado virtual; el de `silent` sobraba aqui.
InputMethod=
