[General]
# A starting point, not the source of truth. The live accent is read by Main.qml
# from /var/lib/sddm-hyprisland/accent, written by login-sync.sh -as your user-
# every time the wallpaper changes. What is here is what gets painted during the
# milliseconds that read takes, and the theme installer seeds it.
accent=#8cd8c2
# Fallback: used only if there is no wallpaper yet in /var/lib/sddm-hyprisland.
background=backgrounds/current.jpg

# Login language: es or en. The installer writes it (your locale's, or what
# --lang says). If it is missing, the theme comes up in Spanish.
language=es
