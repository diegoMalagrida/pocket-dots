[General]
# Punto de partida, no fuente de verdad. El acento vivo lo lee Main.qml de
# /var/lib/sddm-hyprisland/accent, que escribe login-sync.sh -como tu usuario-
# cada vez que cambia el wallpaper. Esto de aqui es lo que se pinta durante los
# milisegundos que tarda esa lectura, y lo siembra el instalador del tema.
accent=#8cd8c2
# Fallback: se usa solo si aun no hay fondo en /var/lib/sddm-hyprisland.
background=backgrounds/current.jpg

# Idioma del login: es (por defecto) o en. Lo escribe el instalador con
# ./install.sh --lang en. Si falta, el tema sale en castellano.
language=es
