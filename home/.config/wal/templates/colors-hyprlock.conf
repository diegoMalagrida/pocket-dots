$accent = rgba({color4.strip}ff)

# Same as the notch: the surface is black and the wallpaper colours only
# appear as an accent. That way a dull palette does not turn the whole island
# grey.
$surface = rgba(000000f0)
$surfaceAlt = rgba(181818ff)
$outline = rgba(ffffff18)
$text = rgba(ffffffff)
$muted = rgba(b0b0b0ff)
$dim = rgba(7d7d7dff)
$shadow = rgba(000000a6)

# Fixed semantic states, as in Quickshell. A pywal colour has no reason to
# correctly mean success, warning or error.
$ok = rgba(6dbd7aff)
$warn = rgba(e0a458ff)
$fail = rgba(e05c5cff)
