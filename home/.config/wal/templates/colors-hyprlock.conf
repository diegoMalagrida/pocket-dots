$accent = rgba({color4.strip}ff)

# Igual que el notch: la superficie es negra y los colores del fondo solo
# aparecen como acento. Asi una paleta apagada no vuelve gris toda la isla.
$surface = rgba(000000f0)
$surfaceAlt = rgba(181818ff)
$outline = rgba(ffffff18)
$text = rgba(ffffffff)
$muted = rgba(b0b0b0ff)
$dim = rgba(7d7d7dff)
$shadow = rgba(000000a6)

# Estados semanticos fijos, como en Quickshell. Un color de pywal no tiene por
# que significar correctamente exito, aviso o error.
$ok = rgba(6dbd7aff)
$warn = rgba(e0a458ff)
$fail = rgba(e05c5cff)
