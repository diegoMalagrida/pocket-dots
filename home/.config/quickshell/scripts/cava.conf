# cava.conf — cava en modo "solo datos" para el visualizador del notch.
# No dibuja nada: escupe por stdout una línea por frame con 8 valores
# (0-1000) separados por ';', y ShellState.qml los lee. Ver ShellState.qml,
# sección "espectro de audio".

[general]
# 60 = un valor nuevo por cada fotograma de pantalla. Con eso la barra se pinta
# donde toca sin animación de por medio; a 30 cada valor duraba dos fotogramas y
# había que interpolar, que es de donde salía el movimiento a tirones.
framerate = 60
# Tiene que cuadrar con ShellState.bands. Pocas y gruesas: 14 barras de 2,5 px
# en una tira de 60 px se leen como una trama, no como un ecualizador.
bars = 8
# autosens ajusta la ganancia sola: música baja sigue llenando las barras y
# música alta no se queda pegada al techo.
autosens = 1
lower_cutoff_freq = 40
higher_cutoff_freq = 14000
# 0 = no dormir nunca. Quien apaga cava es ShellState (solo corre con música);
# si además se durmiera solo, un tramo callado de la canción congelaría las
# barras a media altura en vez de bajarlas.
sleep_timer = 0

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10
# Mono: las 8 barras van de graves a agudos. En stereo serían 4 espejadas,
# que en una tira de 22px de alto no se lee como nada.
channels = mono
mono_option = average

[smoothing]
# ESTE es el mando de "cómo se mueven". 0 = nervioso y ruidoso, 100 = lento y
# pastoso. En una tira de 2,5 px de ancho el nerviosismo se lee como ruido, así
# que tiramos a suave. Suavizar aquí y no con un Behavior en QML: cava filtra
# la señal (con su caída por gravedad), una animación solo persigue el valor.
#
# 2026-08-07: estaba en 70, por debajo del propio defecto de cava. Se probó a
# subirlo (85, 92) y a cuantizar la altura en escalones al estilo Tide-island:
# lo primero se quedaba corto y lo segundo salía peor, un movimiento a tirones
# —la barra se quedaba quieta y luego pegaba el salto—. Medido sobre la altura
# pintada, la cuantización solo bajaba la aceleración un 21% y dejaba el
# visualizador MÁS parado que antes (movimiento 2,6 px/s frente a 4,4).
#
# Lo que sí funciona no es un ajuste de cava: es el seguidor exponencial de
# ShellState.qml (cavaSube/cavaBaja) — sube rápido y baja despacio, como un
# vúmetro. Con él la aceleración cae un 66% y el recorrido sube a 8,9 px.
#
# Así que este número se queda en el defecto de cava y el carácter del
# movimiento se toca allí. cava lo relee con `pkill -USR1 -x cava`.
noise_reduction = 77
