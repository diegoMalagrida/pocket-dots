# cava.conf — cava in "data only" mode for the notch visualiser.
# It draws nothing: it spits one line per frame to stdout with 8 values
# (0-1000) separated by ';', and ShellState.qml reads them. See ShellState.qml,
# section "espectro de audio" (audio spectrum).

[general]
# 60 = one new value per screen frame. That way the bar is painted where it
# belongs with no animation in between; at 30 each value lasted two frames and
# had to be interpolated, which is where the jerky movement came from.
framerate = 60
# Has to match ShellState.bands. Few and thick: 14 bars of 2.5 px in a 60 px
# strip read as a texture, not as an equaliser.
bars = 8
# autosens adjusts the gain by itself: quiet music still fills the bars and
# loud music does not stay stuck to the ceiling.
autosens = 1
lower_cutoff_freq = 40
higher_cutoff_freq = 14000
# 0 = never sleep. What turns cava off is ShellState (it only runs with music);
# if it also went to sleep on its own, a quiet stretch of the song would freeze
# the bars at half height instead of bringing them down.
sleep_timer = 0

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10
# Mono: the 8 bars go from bass to treble. In stereo they would be 4 mirrored,
# which in a strip 22px high does not read as anything.
channels = mono
mono_option = average

[smoothing]
# THIS is the "how do they move" knob. 0 = jittery and noisy, 100 = slow and
# mushy. In a strip 2.5 px wide the jitter reads as noise, so we lean towards
# smooth. Smoothing here and not with a Behavior in QML: cava filters the
# signal (with its gravity fall-off), an animation only chases the value.
#
# 7 Aug 2026: it was at 70, below cava's own default. We tried raising it
# (85, 92) and quantising the height into steps in the Tide-island style: the
# first fell short and the second came out worse, a jerky movement —the bar
# stood still and then jumped—. Measured on the painted height, quantisation
# only lowered acceleration by 21% and left the visualiser MORE static than
# before (movement 2.6 px/s against 4.4).
#
# What does work is not a cava setting: it is the exponential follower in
# ShellState.qml (cavaSube/cavaBaja) — it rises fast and falls slowly, like a
# VU meter. With it acceleration drops by 66% and the travel goes up to 8.9 px.
#
# So this number stays at cava's default and the character of the movement is
# tuned over there. cava rereads it with `pkill -USR1 -x cava`.
noise_reduction = 77
