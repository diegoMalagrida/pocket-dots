# Headless mode: luminous does not draw the screen picker, it asks over the
# luminus_selector.sock socket instead. luminous-autoselect.service answers
# there, and it always picks monitor 0. Without this, every RustDesk connection
# would sit waiting for someone to press a button on the laptop.
[Unit]
Requires=luminous-autoselect.service
After=luminous-autoselect.service

[Service]
Environment=LUMIOUS_HEADLESS=1
