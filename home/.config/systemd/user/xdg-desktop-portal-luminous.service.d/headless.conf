# Modo headless: luminous no dibuja el selector de pantalla, sino que pregunta
# por el socket luminus_selector.sock. Ahi contesta luminous-autoselect.service,
# que elige siempre el monitor 0. Sin esto, cada conexion de RustDesk se quedaria
# esperando a que alguien pulse un boton en el portatil.
[Unit]
Requires=luminous-autoselect.service
After=luminous-autoselect.service

[Service]
Environment=LUMIOUS_HEADLESS=1
