# Política de OOM para las aplicaciones del usuario.
#
# POR QUÉ SOLO app.slice: systemd-oomd mata siempre un cgroup DESCENDIENTE del
# que lleva la marca, nunca el marcado. Los descendientes de app.slice son los
# scopes de cada aplicación (Chrome, cada ventana de kitty, el panel de IA...).
# El compositor (wayland-wm@hyprland.desktop.service) y quickshell.service viven
# en session.slice, que NO cuelga de aquí: por construcción no pueden ser
# elegidos como víctima. Ese es el motivo de acotarlo aquí y no en -.slice.
#
# DOS DISPARADORES INDEPENDIENTES:
#  - Presión: si app.slice supera el 50% de presión de memoria (fracción de
#    tiempo en que TODAS sus tareas están paradas esperando memoria) durante
#    20 s seguidos, muere el scope con más actividad de reclaim. El defecto de
#    systemd es 60% / 30 s; se adelanta un poco para actuar antes de que el
#    escritorio se note pastoso, sin llegar a ser gatillo fácil.
#  - Swap: red de seguridad. Cuando RAM y swap superan AMBAS el 90%
#    (SwapUsedLimit, en oomd.conf), muere el scope que más swap ocupe.
[Slice]
ManagedOOMSwap=kill
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=50%
ManagedOOMMemoryPressureDurationSec=20s
