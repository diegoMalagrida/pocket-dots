# OOM policy for the user's applications.
#
# WHY ONLY app.slice: systemd-oomd always kills a cgroup that DESCENDS from the
# one carrying the mark, never the marked one itself. The descendants of
# app.slice are the scopes of each application (Chrome, each kitty window, the
# AI panel...). The compositor (wayland-wm@hyprland.desktop.service) and
# quickshell.service live in session.slice, which does NOT hang from here: by
# construction they cannot be chosen as the victim. That is the reason for
# scoping it here and not in -.slice.
#
# TWO INDEPENDENT TRIGGERS:
#  - Pressure: if app.slice goes above 50% memory pressure (the fraction of
#    time in which ALL its tasks are stalled waiting for memory) for 20 s in a
#    row, the scope with the most reclaim activity dies. The systemd default is
#    60% / 30 s; it is brought forward a little to act before the desktop
#    starts to feel sluggish, without becoming trigger-happy.
#  - Swap: safety net. When RAM and swap BOTH go above the SwapUsedLimit
#    threshold (in oomd.conf), the scope using the most swap dies.
#    On 2026-09-14 that threshold dropped from 90% to 70%, because at 90% it
#    arrived too late: the machine froze at 15:20 and oomd killed the culprit
#    when not even the keyboard responded. See
#    /etc/systemd/oomd.conf.d/99-anti-freeze.conf.
[Slice]
ManagedOOMSwap=kill
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=50%
ManagedOOMMemoryPressureDurationSec=20s
